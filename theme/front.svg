<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- CS Prayers front piece: illuminated cross-and-brackets with circuit filigree -->
  <defs>
    <radialGradient id="parch" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#f1e9d8"/>
    </radialGradient>
    <g id="quatrefoil" fill="#b08d3f">
      <circle cx="0" cy="-9" r="6"/>
      <circle cx="0" cy="9" r="6"/>
      <circle cx="-9" cy="0" r="6"/>
      <circle cx="9" cy="0" r="6"/>
      <circle cx="0" cy="0" r="4" fill="#6e1c2e"/>
    </g>
    <!-- circuit trace: line with via dots -->
    <g id="trace" stroke="#b08d3f" stroke-width="2" fill="#faf6ed">
      <path d="M 0 0 H 90 L 130 40 H 210" fill="none"/>
      <circle cx="0" cy="0" r="5"/>
      <circle cx="210" cy="40" r="5"/>
      <path d="M 20 22 H 80 L 112 54 H 160" fill="none"/>
      <circle cx="20" cy="22" r="4"/>
      <circle cx="160" cy="54" r="4"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#parch)"/>

  <!-- double frame -->
  <rect x="34" y="34" width="1532" height="832" fill="none" stroke="#b08d3f" stroke-width="5"/>
  <rect x="52" y="52" width="1496" height="796" fill="none" stroke="#b08d3f" stroke-width="1.8"/>

  <!-- corner quatrefoils -->
  <use href="#quatrefoil" x="34" y="34"/>
  <use href="#quatrefoil" x="1566" y="34"/>
  <use href="#quatrefoil" x="34" y="866"/>
  <use href="#quatrefoil" x="1566" y="866"/>

  <!-- circuit filigree in corners, inside frame -->
  <use href="#trace" x="90" y="95"/>
  <use href="#trace" x="1510" y="95" transform="scale(-1,1) translate(-3020,0)"/>
  <use href="#trace" x="90" y="805" transform="translate(0,1610) scale(1,-1)"/>
  <use href="#trace" x="1510" y="805" transform="translate(-3020,1610) scale(-1,-1)"/>

  <!-- radiant halo -->
  <g stroke="#b08d3f" fill="none">
    <circle cx="800" cy="450" r="300" stroke-width="2"/>
    <circle cx="800" cy="450" r="286" stroke-width="1"/>
    <!-- rays -->
    <g stroke-width="2">
      <line x1="800" y1="118" x2="800" y2="70"/>
      <line x1="468" y1="450" x2="420" y2="450"/>
      <line x1="1132" y1="450" x2="1180" y2="450"/>
      <line x1="1035" y1="215" x2="1069" y2="181"/>
      <line x1="565" y1="215" x2="531" y2="181"/>
      <line x1="1035" y1="685" x2="1069" y2="719"/>
      <line x1="565" y1="685" x2="531" y2="719"/>
    </g>
  </g>

  <!-- central mark: brackets + cross -->
  <g fill="none" stroke="#6e1c2e" stroke-width="34" stroke-linecap="square">
    <polyline points="640,290 490,450 640,610"/>
    <polyline points="960,290 1110,450 960,610"/>
  </g>
  <g fill="#6e1c2e">
    <path d="M 785 240
             L 815 240
             L 810 372 L 900 368
             L 900 396
             L 810 392 L 815 660
             L 785 660
             L 790 392 L 700 396
             L 700 368
             L 790 372 Z"/>
  </g>
  <line x1="800" y1="254" x2="800" y2="646" stroke="#b08d3f" stroke-width="4"/>
  <line x1="714" y1="382" x2="886" y2="382" stroke="#b08d3f" stroke-width="4"/>

  <!-- vine flourishes left and right of halo -->
  <g stroke="#b08d3f" stroke-width="2.5" fill="none">
    <path d="M 180 450 C 250 400, 300 500, 380 450"/>
    <path d="M 1420 450 C 1350 400, 1300 500, 1220 450"/>
  </g>
  <g fill="#b08d3f">
    <ellipse cx="252" cy="428" rx="9" ry="4.5" transform="rotate(-25 252 428)"/>
    <ellipse cx="312" cy="470" rx="9" ry="4.5" transform="rotate(25 312 470)"/>
    <ellipse cx="1348" cy="428" rx="9" ry="4.5" transform="rotate(25 1348 428)"/>
    <ellipse cx="1288" cy="470" rx="9" ry="4.5" transform="rotate(-25 1288 470)"/>
    <circle cx="180" cy="450" r="4"/>
    <circle cx="1420" cy="450" r="4"/>
  </g>

  <!-- bottom ornament -->
  <g fill="#b08d3f">
    <circle cx="770" cy="812" r="4"/>
    <circle cx="800" cy="812" r="4"/>
    <circle cx="830" cy="812" r="4"/>
  </g>
</svg>
