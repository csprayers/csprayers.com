<style>
  /* ————— Presentation mode (always candlelit, independent of site theme) ————— */
  .present-btn {
    display: block;
    margin: 0 auto 1rem;
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    font-size: 1.02rem;
    letter-spacing: 0.04em;
    color: inherit;
    background: transparent;
    padding: 0.4rem 1.3rem;
    border: 1px solid rgba(176, 141, 63, 0.6);
    border-radius: 2px;
    cursor: pointer;
  }
  .present-btn:hover {
    border-color: #b08d3f;
  }

  #prayer-present {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #1d1712;
    color: #e8ddc8;
    font-family: "EB Garamond", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 8vw;
    cursor: pointer;
  }
  #prayer-present[hidden] { display: none; }

  #prayer-present .pp-text {
    font-size: clamp(1.8rem, 4.2vw, 3.4rem);
    line-height: 1.6;
    max-width: 26em;
  }
  #prayer-present .pp-title {
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    color: #d29aa5;
    font-size: clamp(2.2rem, 5vw, 4rem);
    line-height: 1.3;
  }
  #prayer-present .pp-context {
    font-style: italic;
    color: #b3a68e;
    font-size: clamp(1.2rem, 2.2vw, 1.8rem);
    margin-top: 1.5rem;
  }
  #prayer-present .pp-ornament {
    color: #c9a44f;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    margin-bottom: 2rem;
  }
  #prayer-present .pp-progress {
    position: absolute;
    bottom: 2.2vh;
    right: 3vw;
    color: rgba(179, 166, 142, 0.65);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }
  #prayer-present .pp-hint {
    position: absolute;
    bottom: 2.2vh;
    left: 3vw;
    color: rgba(179, 166, 142, 0.65);
    font-size: 0.95rem;
    font-style: italic;
  }
  #prayer-present .pp-close {
    position: absolute;
    top: 2.2vh;
    right: 3vw;
    background: none;
    border: none;
    color: rgba(232, 221, 200, 0.7);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }
  #prayer-present .pp-close:hover { color: #e8ddc8; }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const titleEl = document.querySelector("#title-block-header h1.title");
    const stanzas = Array.from(
      document.querySelectorAll("main.content blockquote p, main .content blockquote p")
    ).map((p) => p.innerText.trim()).filter(Boolean);
    if (!titleEl || stanzas.length < 2) return; // only prayer pages

    // ---- build slide list: title slide, stanzas, closing ornament ----
    const contextEl = document.querySelector("main em");
    const author = document.querySelector(".quarto-title-meta-contents p");
    const slides = [];
    slides.push({
      title: titleEl.innerText.trim(),
      context: [contextEl ? contextEl.innerText.trim() : null,
                author ? author.innerText.trim() : null].filter(Boolean).join(" · "),
    });
    stanzas.forEach((s) => slides.push({ text: s }));
    slides.push({ ornament: true });

    // ---- button ----
    const btn = document.createElement("button");
    btn.className = "present-btn";
    btn.textContent = "Present as slides";
    btn.setAttribute("aria-label", "Present this prayer as fullscreen slides");
    titleEl.closest("#title-block-header").after(btn);

    // ---- overlay ----
    const ov = document.createElement("div");
    ov.id = "prayer-present";
    ov.hidden = true;
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-modal", "true");
    ov.setAttribute("aria-label", "Prayer presentation");
    ov.innerHTML =
      '<button class="pp-close" aria-label="Close presentation">&times;</button>' +
      '<div class="pp-body"></div>' +
      '<div class="pp-hint">space or &rarr; to advance &middot; esc to exit</div>' +
      '<div class="pp-progress"></div>';
    document.body.appendChild(ov);
    const body = ov.querySelector(".pp-body");
    const progress = ov.querySelector(".pp-progress");

    let i = 0;
    const esc = (t) => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
    function render() {
      const s = slides[i];
      if (s.ornament) {
        body.innerHTML = '<div class="pp-ornament">❦</div>';
      } else if (s.title) {
        body.innerHTML =
          '<div class="pp-ornament">❦</div>' +
          '<div class="pp-title">' + esc(s.title) + "</div>" +
          (s.context ? '<div class="pp-context">' + esc(s.context) + "</div>" : "");
      } else {
        body.innerHTML = '<div class="pp-text">' + esc(s.text) + "</div>";
      }
      progress.textContent = (i + 1) + " / " + slides.length;
    }
    function open() {
      i = 0; render(); ov.hidden = false;
      document.documentElement.requestFullscreen?.().catch(() => {});
      ov.focus?.();
    }
    function close() {
      ov.hidden = true;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      btn.focus();
    }
    const next = () => { if (i < slides.length - 1) { i++; render(); } else close(); };
    const prev = () => { if (i > 0) { i--; render(); } };

    btn.addEventListener("click", open);
    ov.querySelector(".pp-close").addEventListener("click", (e) => { e.stopPropagation(); close(); });
    ov.addEventListener("click", next);
    document.addEventListener("keydown", (e) => {
      if (ov.hidden) return;
      switch (e.key) {
        case "Escape": close(); break;
        case "ArrowRight": case " ": case "PageDown": case "ArrowDown": case "Enter":
          e.preventDefault(); next(); break;
        case "ArrowLeft": case "PageUp": case "ArrowUp":
          e.preventDefault(); prev(); break;
      }
    });
  });
</script>
