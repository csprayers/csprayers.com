project:
  type: website
  output-dir: _site
  pre-render: scripts/build_index.py

website:
  title: Prayers for Computer Science
  favicon: icon.png
  site-url: https://csprayers.com
  repo-url: https://github.com/csprayers/csprayers.com
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: icon.png
    title: CS Prayers
    right:
      - href: index.md
        text: Home
      - href: prayers.qmd
        text: All Prayers
      - icon: github
        href: https://github.com/csprayers/csprayers.com
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      # BEGIN GENERATED SIDEBAR — do not edit by hand; run scripts/build_index.py
      - index.md
      - prayers.qmd
      - section: "I. The Rhythms of the Academic Year"
        contents:
        - 1-academic-year/beginnings/revising-course.md
        - 1-academic-year/beginnings/first-day-student.md
        - 1-academic-year/endings/receiving-evaluations.md
      - section: "II. The Work of Learning (For Students)"
        contents:
        - 2-learning/intellectual-struggle/big-o-notation.md
      - section: "III. The Work of Teaching (For Professors)"
        contents:
        - 3-teaching/professional/reviewing-papers.md
      - section: "VI. Moments of Struggle & Doubt"
        contents:
        - 6-struggle/personal/work-life-balance.md
      - section: "X. Seasons & Daily Rhythms"
        contents:
        - 10-rhythms/daily/morning-coffee.md
      - section: "XI. Relationships & Humanity"
        contents:
        - 11-relationships/with-professors/professor-retires.md
      # END GENERATED SIDEBAR
  page-footer:
    center: '*"The heavens declare the glory of God" — Psalm 19:1* · A project curated by Eric Araújo, Calvin University'

format:
  html:
    theme:
      light:
        - cosmo
        - theme/liturgy.scss
      dark:
        - cosmo
        - theme/liturgy-dark.scss
    toc: false
    grid:
      sidebar-width: 320px
      body-width: 760px
